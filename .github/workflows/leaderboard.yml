name: Check NRPL leaderboard

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay runs a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit state.json

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check leaderboard and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot_split.py --once   # use bot.py for the single-embed version

      - name: Save latest standings
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "leaderboard-bot"
            git config user.email "leaderboard-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update leaderboard state"
            git push
          fi
