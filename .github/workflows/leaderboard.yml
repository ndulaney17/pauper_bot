name: Check NRPL leaderboard

on:
  schedule:
    # Fridays at 09:07 UTC = 3:07 AM Central Standard Time (4:07 AM during daylight saving).
    # GitHub cron is UTC and ignores daylight saving. GitHub can also start runs late.
    - cron: "7 9 * * 5"
  workflow_dispatch:          # manual run from the Actions tab

permissions:
  contents: write             # needed to commit state.json

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check leaderboard and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py --once

      - name: Save latest standings
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "leaderboard-bot"
            git config user.email "leaderboard-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update leaderboard state"
            git push
          fi
